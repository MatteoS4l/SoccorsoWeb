openapi: 3.0.3
info:
  title: SoccorsoWeb REST API
  description: |-
    API per la gestione di SoccorsoWeb.
  version: 1.0.0

servers:
  - url: /SoccorsoWebREST/api

tags:
  - name: Autenticazione
    description: Operazioni di sessione (Login/Logout)
  - name: Richieste Soccorso
    description: Gestione delle emergenze segnalate
  - name: Missioni
    description: Gestione operativa degli interventi
  - name: Operatori
    description: Gestione del personale e delle disponibilità

paths:
  /auth/login:
    post:
      tags: [Autenticazione]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Autenticazione riuscita
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  utente:
                    $ref: "#/components/schemas/Utente"
        "400":
          description: Dati mancanti
        "401":
          description: Credenziali errate

  /auth/logout:
    post:
      tags: [Autenticazione]
      summary: Logout
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout effettuato
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "401":
          description: Token non valido o mancante

  /richieste:
    get:
      tags: [Richieste Soccorso]
      summary: Lista delle richieste
      security:
        - bearerAuth: []
      parameters:
        - name: stato
          in: query
          description:
          schema:
            type: string
            enum: [DA_CONVALIDARE, IN_ATTESA, CONFERMATA, CHIUSA, RIFIUTATA]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Successo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RichiestaSoccorso"
        "401":
          description: Non autorizzato

    post:
      tags: [Richieste Soccorso]
      summary: Inserimento nuova richiesta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RichiestaSoccorso"
      responses:
        "201":
          description: Richiesta creata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RichiestaSoccorso"
        "400":
          description: Dati obbligatori mancanti

  /richieste/tipologie:
    get:
      tags: [Richieste Soccorso]
      summary: Elenco tipologie emergenza
      responses:
        "200":
          description: Successo
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /richieste/stati:
    get:
      tags: [Richieste Soccorso]
      summary: Elenco stati richiesta
      responses:
        "200":
          description: Successo
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /richieste/priorita:
    get:
      tags: [Richieste Soccorso]
      summary: Elenco livelli di priorità
      responses:
        "200":
          description: Successo
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /richieste/{id}:
    get:
      tags: [Richieste Soccorso]
      summary: Dettaglio richiesta
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RichiestaSoccorso"
        "401":
          description: Non autorizzato
        "404":
          description: Richiesta non trovata

  /richieste/convalida/{token}:
    get:
      tags: [Richieste Soccorso]
      summary: Convalida richiesta
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Convalidata
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "404":
          description: Token non valido o già convalidato

  /richieste/insuccessi:
    get:
      tags: [Richieste Soccorso]
      summary: Lista richieste con valutazione < 5
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RichiestaSoccorso"
        "401":
          description: Non autorizzato

  /richieste/{id}/rifiuta:
    post:
      tags: [Richieste Soccorso]
      summary: Rifiuto richiesta (Admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rifiutata
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Impossibile rifiutare
        "401":
          description: Non autorizzato
        "403":
          description: Permessi insufficienti
        "404":
          description: Richiesta non trovata

  /operatori:
    get:
      tags: [Operatori]
      summary: Elenco operatori
      security:
        - bearerAuth: []
      parameters:
        - name: stato
          in: query
          schema:
            type: string
            enum: [libero]
      responses:
        "200":
          description: Successo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Utente"
        "401":
          description: Non autorizzato

  /operatori/{id}:
    get:
      tags: [Operatori]
      summary: Dettagli operatore
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Utente"
        "401":
          description: Non autorizzato
        "404":
          description: Operatore non trovato

  /operatori/{id}/missioni:
    get:
      tags: [Operatori]
      summary: Storico missioni di un operatore
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Missione"
        "401":
          description: Non autorizzato
        "404":
          description: Operatore non trovato

  /missioni:
    get:
      tags: [Missioni]
      summary: Elenco missioni
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Successo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Missione"
        "401":
          description: Non autorizzato

    post:
      tags: [Missioni]
      summary: Creazione missione (Admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Missione"
      responses:
        "201":
          description: Missione avviata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Missione"
        "400":
          description: Dati insufficienti
        "401":
          description: Non autorizzato
        "404":
          description: Richiesta non trovata

  /missioni/{id}:
    get:
      tags: [Missioni]
      summary: Dettaglio missione
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Successo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Missione"
        "401":
          description: Non autorizzato
        "404":
          description: Missione non trovata

  /missioni/{id}/chiusura:
    post:
      tags: [Missioni]
      summary: Chiusura missione (Admin o Caposquadra)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [livelloSuccesso]
              properties:
                livelloSuccesso:
                  type: integer
                  minimum: 1
                  maximum: 5
                note:
                  type: string
      responses:
        "200":
          description: Chiusa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Valutazione non valida
        "401":
          description: Non autorizzato
        "403":
          description: Solo un Admin o un Caposquadra possono chiudere una missione
        "404":
          description: Missione non trovata

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    Utente:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        cognome:
          type: string
        email:
          type: string
        password:
          type: string
        ruolo:
          type: string
          enum: [ADMIN, OPERATORE]
        skills:
          type: array
          items:
            type: string
        patenti:
          type: array
          items:
            type: string
        missioniPartecipate:
          type: array
          items:
            type: string

    RichiestaSoccorso:
      type: object
      properties:
        id:
          type: integer
        nomeRichiedente:
          type: string
        contattoEmail:
          type: string
        indirizzo:
          type: string
        descrizione:
          type: string
        tipologia:
          type: string
          enum:
            [
              INCIDENTE_STRADALE,
              INCIDENTE_DOMESTICO,
              INFORTUNIO_LAVORO,
              MALORE,
              INCENDIO,
              FUGA_GAS,
              ALLUVIONE,
              TERREMOTO,
              FRANA,
              VALANGA,
              RICERCA_DISPERSO,
              SALVATAGGIO,
              INQUINAMENTO_AMBIENTALE,
              GUASTO_INFRASTRUTTURA,
              CROLLO_EDIFICIO,
              MINACCIA_BOMBA,
              RAPINA,
              AGGRESSIONE,
              GUASTO_CALDAIA,
              GUASTO_ELETTRODOMESTICO,
              ALTRO,
            ]
        stato:
          type: string
          enum: [DA_CONVALIDARE, IN_ATTESA, CONFERMATA, CHIUSA, RIFIUTATA]
        priorita:
          type: string
          enum: [BASSA, MEDIA, ALTA, URGENTE]
        dataOraRichiesta:
          type: string
          format: date-time
        codiceConvalida:
          type: string
        foto:
          type: string

    Missione:
      type: object
      properties:
        id:
          type: integer
        obiettivo:
          type: string
        stato:
          type: string
          enum: [ATTIVA, COMPLETATA, ANNULLATA]
        dataOraInizio:
          type: string
          format: date-time
        dataOraFine:
          type: string
          format: date-time
        livelloSuccesso:
          type: integer
        note:
          type: string
        richiestaId:
          type: integer
        adminId:
          type: integer
        caposquadraId:
          type: integer
        operatoriIds:
          type: array
          items:
            type: integer
        richiesta:
          $ref: "#/components/schemas/RichiestaSoccorso"
        caposquadra:
          $ref: "#/components/schemas/Utente"
        operatori:
          type: array
          items:
            $ref: "#/components/schemas/Utente"
